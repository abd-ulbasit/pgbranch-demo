# Runs the repo's migrations against a PR's pgbranch database branch — real
# production-shaped data, created in ~2s by the pgbranch webhook when the PR
# was opened. This is the job that produced PR #1's recorded failure.
#
# ARCHIVED. The demo's EKS cluster was decommissioned in June 2026, so there
# is no pgbranch proxy left for this to reach and it no longer runs on
# `pull_request`. It is kept in-tree as the reference wiring: this file is
# what "CI runs your migrations against a branch of prod" actually looks like.
#
# It last did real work on 2026-06-11 (10 successful runs, plus 2 genuine
# failures on feat/signup-stats). From 2026-06-13 it skipped every single run,
# because the job gated on `vars.PGBRANCH_PROXY_HOST` and the move to EKS
# stopped setting that variable — the gate silently went permanently false.
# That silent-skip gate is gone: the preflight below fails loudly instead, so
# a run can never again look like it passed when it did nothing.
#
# To use it against your own pgbranch install, set:
#   vars.PGBRANCH_PROXY_HOST      e.g. "pgbranch.internal:6432"
#   vars.PGBRANCH_PG_USER         optional, defaults to "postgres"
#   secrets.PGBRANCH_PG_PASSWORD
# and add the `pull_request:` trigger back.
name: pr-db-check
on:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: 'Git ref whose pgbranch database branch to migrate (e.g. feat/order-tags)'
        required: true
        type: string

jobs:
  migrate-against-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — require the pgbranch proxy to be configured
        env:
          PGBRANCH_PROXY_HOST: ${{ vars.PGBRANCH_PROXY_HOST }}
        run: |
          if [ -z "$PGBRANCH_PROXY_HOST" ]; then
            echo "::error::vars.PGBRANCH_PROXY_HOST is not set — there is no pgbranch proxy to migrate against."
            echo "The demo cluster this repo used was decommissioned in June 2026."
            echo "Set vars.PGBRANCH_PROXY_HOST and secrets.PGBRANCH_PG_PASSWORD to point at your own install."
            exit 1
          fi
          echo "pgbranch proxy: $PGBRANCH_PROXY_HOST"

      - name: Apply migrations to the branch's database
        env:
          PGBRANCH_PROXY_HOST: ${{ vars.PGBRANCH_PROXY_HOST }}
          PGPASSWORD: ${{ secrets.PGBRANCH_PG_PASSWORD }}
          BRANCH_REF: ${{ inputs.branch_ref }}
        run: |
          export PGHOST="${PGBRANCH_PROXY_HOST%%:*}"
          export PGPORT="${PGBRANCH_PROXY_HOST##*:}"
          export PGUSER="${{ vars.PGBRANCH_PG_USER || 'postgres' }}"
          # the database name routes through the pgbranch proxy to the ref's
          # branch, named after the git branch (ghook git-branch naming)
          BRANCH=$(echo "$BRANCH_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-41 | sed 's/-*$//')
          export PGDATABASE="postgres@$BRANCH"
          echo "migrating $PGDATABASE"
          # the webhook acks instantly and creates the branch async (~10-15s
          # as a pod) — wait for it to accept connections before migrating
          for i in $(seq 1 24); do
            psql -qAtc "SELECT 1" >/dev/null 2>&1 && break
            echo "waiting for branch database ($i)..."; sleep 5
          done
          # if it never came up, fail here rather than letting migrate.sh
          # report a confusing connection error
          psql -qAtc "SELECT 1" >/dev/null
          ./scripts/migrate.sh
