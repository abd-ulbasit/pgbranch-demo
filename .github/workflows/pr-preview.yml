# Per-PR app preview — the "Vercel-style" half of the workflow that pgbranch
# deliberately doesn't do. pgbranch (via ghook) creates the per-PR DATABASE
# branch; this job deploys the APP for the PR, points it at that branch, and
# posts a preview-URL comment.
#
# Cluster-agnostic via repo variables/secrets:
#   vars.PREVIEW_ENABLED = "true"        gate
#   vars.PGBRANCH_API    = https://<branchd API LB>:7070
#   vars.PREVIEW_URL     = http://<orders-api app LB>:8090
#   secrets.KUBECONFIG_B64 = base64 kubeconfig (scoped SA token; public API)
#   secrets.PGBRANCH_TOKEN = branchd bearer token
#
# On EKS the API/LBs are public, so no tunnel is needed. (The earlier k3s
# variant joined the tailnet first; that step is gone.)
name: pr-preview
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency: pr-preview

permissions:
  pull-requests: write
  contents: read

jobs:
  preview:
    if: ${{ vars.PREVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      PGBRANCH_SERVER: ${{ vars.PGBRANCH_API }}
      PROXY_SVC: pgbranch-proxy.pgbranch.svc.cluster.local
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          kubectl get ns demo >/dev/null 2>&1 || kubectl create ns demo

      - name: Derive branch + wait for its pgbranch database
        id: db
        run: |
          BRANCH=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-41 | sed 's/-*$//')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Waiting for pgbranch branch '$BRANCH' (created by the webhook)…"
          for i in $(seq 1 60); do
            J=$(curl -s -H "Authorization: Bearer ${{ secrets.PGBRANCH_TOKEN }}" "$PGBRANCH_SERVER/v1/branches/$BRANCH" || true)
            if [ "$(echo "$J" | jq -r '.state // empty')" = "ready" ]; then
              echo "branch is ready"; exit 0
            fi
            sleep 5
          done
          echo "branch never became ready"; exit 1

      - name: Deploy preview app
        env:
          # inherit-mode: branches share the source password (rotation off,
          # which is what static-env preview flows like Vercel also need)
          PGPASSWORD: ${{ secrets.PGBRANCH_DB_PASSWORD }}
        run: |
          BRANCH=${{ steps.db.outputs.branch }}
          DSN="host=$PROXY_SVC port=6432 user=postgres password=$PGPASSWORD dbname=postgres@$BRANCH sslmode=disable"
          kubectl -n demo create secret generic orders-db \
            --from-literal=dsn="$DSN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n demo apply -f - <<YAML
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: orders-api, labels: { app: orders-api } }
          spec:
            replicas: 1
            selector: { matchLabels: { app: orders-api } }
            template:
              metadata: { labels: { app: orders-api } }
              spec:
                containers:
                - name: app
                  image: ghcr.io/abd-ulbasit/orders-api:v1
                  ports: [{ containerPort: 8090 }]
                  env:
                  - { name: BRANCH, value: "$BRANCH" }
                  - name: DATABASE_URL
                    valueFrom: { secretKeyRef: { name: orders-db, key: dsn } }
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: orders-api }
          spec:
            type: LoadBalancer
            selector: { app: orders-api }
            ports: [{ port: 8090, targetPort: 8090 }]
          YAML
          kubectl -n demo rollout restart deploy/orders-api
          kubectl -n demo rollout status deploy/orders-api --timeout=150s

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.db.outputs.branch }}
        run: |
          MARKER="<!-- pr-preview -->"
          BODY="$MARKER
          ### 🚀 Preview deployment (self-hosted on EKS)

          | | |
          |---|---|
          | **App** | orders-api |
          | **Status** | ✅ Ready |
          | **Preview** | ${PREVIEW_URL}/db |
          | **Database branch** | \`${BRANCH}\` |

          Running in the EKS cluster, reading its per-PR pgbranch database."
          ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH repos/${{ github.repository }}/issues/comments/$ID -f body="$BODY" >/dev/null
          else
            gh api -X POST repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments -f body="$BODY" >/dev/null
          fi
          echo "preview comment posted"
